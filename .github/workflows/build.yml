name: Build

# Two trigger paths:
#   - workflow_dispatch: manual run from the Actions tab. It builds the
#     packages; the release is published when the run is made on a tag.
#   - push of a v* tag: the same build, plus the tag is required to agree
#     with the Makefile version, so a mistyped tag cannot publish a
#     mismatched release.
#
# The packages are built with apk-tools directly, not with an OpenWrt SDK:
# .github/build-pkg.sh assembles the staging tree and apk mkpkg writes the ADB
# container. Only the .apk files are published.
#
# The daemon is not built here. It comes from the release of the engine
# repository, so the engine and the packages are built in one place each.
# The archive is checked against the digest the engine release publishes
# before it is unpacked.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  # A publish that is cancelled halfway leaves a release with some of its
  # assets or a half-written notes file. Tag runs are therefore never
  # cancelled; only branch builds are, which is what the queue is for.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default: the build job runs code from other repositories
# (openwrt/luci, apk-tools) and has no reason to be able to write here. The
# release job asks for the write permission it needs.
permissions:
  contents: read

env:
  APK_TOOLS_REF: 'b5a31c0d865342ad80be10d68f1bb3d3ad9b0866'
  # The commit of openwrt/luci whose Makefile builds po2lmo. A branch name
  # would let an upstream commit change what this workflow executes with the
  # workflow token, so the commit is pinned like the actions are.
  LUCI_REF: '217e71dc75dae31ab670b0e602162a76559a0b47'
  # The release of szwjp/dae that carries the daemon. It must hold the
  # linux-x86_64, linux-arm64 and linux-riscv64_rva23u64 archives.
  DAE_BINARY_TAG: 'v2026.11.07-nativeapi-r4'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            apk_arch: x86_64
            dae_asset: linux-x86_64
          - arch: arm64
            apk_arch: aarch64_generic
            dae_asset: linux-arm64
          - arch: riscv64
            apk_arch: riscv64_generic
            # The engine release publishes the riscv64 leg under its profile
            # name; GitHub runs one riscv64 job, so rva23u64 is the only one.
            dae_asset: linux-riscv64_rva23u64
    steps:
      - name: Checkout source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache apk-tools binary
        id: cache-apk-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /usr/local/bin/apk
          key: apk-tools-${{ env.APK_TOOLS_REF }}-${{ runner.os }}

      - name: Checkout apk-tools
        if: steps.cache-apk-tools.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 'alpinelinux/apk-tools'
          path: 'apk-tools'
          fetch-depth: 0
          ref: ${{ env.APK_TOOLS_REF }}
          persist-credentials: false

      - name: Checkout po2lmo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 'openwrt/luci'
          path: 'po2lmo'
          ref: ${{ env.LUCI_REF }}
          sparse-checkout: 'modules/luci-base/src'
          persist-credentials: false

      - name: Setup dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y build-essential curl fakeroot libssl-dev lua5.1 meson ninja-build

          if [ "${{ steps.cache-apk-tools.outputs.cache-hit }}" != "true" ]; then
            pushd apk-tools
            meson setup build \
              -Db_lto=true \
              -Dcompressed-help=false \
              -Ddocs=disabled \
              -Dhelp=enabled \
              -Dlua_version=5.1 \
              -Ddefault_library=static \
              -Durl_backend=wget \
              -Dzstd=false \
              -Dpython=disabled \
              -Dtests=disabled \
              -Dcrypto_backend=openssl
            ninja -C build
            sudo -E meson install -C build --strip
            popd
          else
            echo "apk-tools 缓存命中，跳过编译"
          fi

          pushd po2lmo/modules/luci-base/src
          make po2lmo
          sudo -E install -m0755 -s po2lmo /usr/local/bin/po2lmo
          popd

      - name: Verify toolchain
        run: |
          command -v apk >/dev/null || { echo "::error::apk 未正确安装"; exit 1; }
          command -v po2lmo >/dev/null || { echo "::error::po2lmo 未正确安装"; exit 1; }
          apk --version

      # The daemon comes from the engine repository's release, so the two
      # repositories never build the same binary twice.
      #
      # The expected digest is read from dae/digests.txt in this repository,
      # not from the .dgst file next to the release: a digest published beside
      # the archive only proves that the two agree, so a replaced release
      # would carry a matching digest and the check would still pass. The
      # pinned values fail the build instead.
      - name: Fetch the daemon
        env:
          DAE_ASSET: ${{ matrix.dae_asset }}
        run: |
          set -euo pipefail
          pinned_tag="$(awk '$1 == "tag" { print $2; exit }' dae/digests.txt)"
          if [ "$pinned_tag" != "$DAE_BINARY_TAG" ]; then
            echo "::error::dae/digests.txt pins $pinned_tag but DAE_BINARY_TAG is $DAE_BINARY_TAG; update both together"
            exit 1
          fi
          expected="$(awk -v f="dae-${DAE_ASSET}.tar.xz" '$2 == f { print $1; exit }' dae/digests.txt)"
          if [ -z "$expected" ]; then
            echo "::error::dae/digests.txt has no sha256 for dae-${DAE_ASSET}.tar.xz"
            exit 1
          fi
          base="https://github.com/szwjp/dae/releases/download/${DAE_BINARY_TAG}"
          url="${base}/dae-${DAE_ASSET}.tar.xz"
          echo "取 $url"
          curl -fsSL --retry 3 -o dae.tar.xz "$url"
          actual="$(sha256sum dae.tar.xz | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::daemon 归档与 dae/digests.txt 不符：期望 $expected，实际 $actual"
            exit 1
          fi
          echo "daemon 归档 sha256 与 dae/digests.txt 一致: $actual"
          # The archive stores its members with a "./" prefix. It is unpacked
          # into a directory of its own: extracting into the workspace root
          # drops usr/ and whatever else the archive carries over the
          # checkout.
          mkdir -p dae-extract
          tar -xJf dae.tar.xz -C dae-extract
          mkdir -p "dae/assets/${{ matrix.arch }}"
          install -m0755 dae-extract/usr/bin/dae "dae/assets/${{ matrix.arch }}/dae"
          file "dae/assets/${{ matrix.arch }}/dae"

      - name: Build packages
        env:
          PKG_ASSET_DIR: assets/${{ matrix.arch }}
          PKG_ARCH_OVERRIDE: ${{ matrix.apk_arch }}
        run: |
          set -euo pipefail
          fakeroot bash .github/build-pkg.sh dae
          # The panel is the same on every architecture, so one leg builds it.
          # Its assets live in the package directory and it is architecture
          # independent, so neither of the daemon's overrides applies to it.
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            PKG_ASSET_DIR= PKG_ARCH_OVERRIDE= fakeroot bash .github/build-pkg.sh luci-app-dae
          fi
          shopt -s nullglob
          apks=(out/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::未生成预期的 apk 文件"
            exit 1
          fi
          printf '生成的包:\n%s\n' "${apks[@]}"

      # apk-tools v3 only reads the ADB container format. Let apk parse every
      # package here, so a malformed one fails in CI instead of on the device.
      - name: Validate apk packages (apk-tools v3)
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(out/*.apk)
          for f in "${apks[@]}"; do
            echo "== $f"
            if [ "$(head -c 3 "$f")" != "ADB" ]; then
              echo "::error::$f 不是 apk v3 (ADB) 格式"
              exit 1
            fi
            apk adbdump "$f" | head -20
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packages-${{ matrix.arch }}
          path: out/*.apk

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download every architecture's packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: packages-*
          path: release/
          merge-multiple: true

      - name: Derive and validate release version
        # The version has a single source: the dae package's Makefile. The
        # panel package carries its own version, so the tag follows the engine.
        run: |
          set -euo pipefail
          MK_V="$(sed -n 's/^PKG_VERSION:=//p' dae/Makefile | head -1)"
          MK_R="$(sed -n 's/^PKG_RELEASE:=//p' dae/Makefile | head -1)"
          EXPECTED="${MK_V}-r${MK_R}"
          if [[ ! "$EXPECTED" =~ ^[0-9][0-9A-Za-z.]*-r[0-9]+$ ]]; then
            echo "::error::Makefile 版本 $EXPECTED 非法（期望形如 2026.11.01-r3）"
            exit 1
          fi
          PANEL_V="$(sed -n 's/^PKG_VERSION:=//p' luci-app-dae/Makefile | head -1)"
          PANEL_R="$(sed -n 's/^PKG_RELEASE:=//p' luci-app-dae/Makefile | head -1)"
          PANEL="${PANEL_V}-r${PANEL_R}"
          if [[ ! "$PANEL" =~ ^[0-9][0-9A-Za-z.]*-r[0-9]+$ ]]; then
            echo "::error::面板 Makefile 版本 $PANEL 非法（期望形如 2026.11.01-r3）"
            exit 1
          fi
          # 等位编号：把 -rN 规范为 -rNN，使 GitHub 按 tag 字符串排序时
          # r02 < r10 < r11，Release 列表保持从大到小。
          canon() {
            printf '%s-r%02d' "${1%-r*}" "$((10#${1##*-r}))"
          }
          TAG_VERSION="$(canon "$EXPECTED")"
          # The release job only runs on a tag, and that tag can arrive from a
          # push or from a manual dispatch. It has to name exactly the version
          # the Makefile produces: otherwise the publish step below would
          # create a second tag on the default branch instead of releasing the
          # tag that was built.
          ON_TAG="${GITHUB_REF_NAME#v}"
          if [[ ! "$ON_TAG" =~ ^[0-9][0-9A-Za-z.]*-r[0-9]+$ ]]; then
            echo "::error::tag v$ON_TAG 格式非法（期望形如 v2026.11.01-r03）"
            exit 1
          fi
          if [ "v$TAG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 Makefile 产物版本 v$TAG_VERSION 不一致（r 编号须补零），拒绝发布"
            exit 1
          fi
          echo "VERSION=$EXPECTED" >> "$GITHUB_ENV"
          echo "PANEL_VERSION=$PANEL" >> "$GITHUB_ENV"
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          echo "发布版本 v$TAG_VERSION（引擎包 $EXPECTED，面板包 $PANEL）"

      - name: Checksum the packages
        # The release carries a checksum file: a package that is fetched over
        # a plain URL can be checked against it before it is installed.
        run: |
          set -euo pipefail
          cd release
          sha256sum *.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        env:
          VERSION: ${{ env.VERSION }}
          PANEL_VERSION: ${{ env.PANEL_VERSION }}
          TAG_VERSION: ${{ env.TAG_VERSION }}
        run: |
          set -euo pipefail
          # The file names are spelled out: apk resolves a URL as it is and
          # does not expand a wildcard, so a "*.apk" in the notes would send
          # the reader to a 404.
          cat > notes.md <<-EOF
          dae 引擎（原生 HTTP 控制面）+ doona 面板。

          在 OpenWrt / ImmortalWrt 上安装（apk）：

          apk v3 的 \`apk add\` 只认本地文件，不接受 URL，所以先把包下载下来再装：

          \`\`\`sh
          cd /tmp
          wget -O dae.apk \\
            https://github.com/szwjp/luci-app-dae/releases/download/v${TAG_VERSION}/dae-${VERSION}-x86_64.apk
          wget -O luci-app-dae.apk \\
            https://github.com/szwjp/luci-app-dae/releases/download/v${TAG_VERSION}/luci-app-dae-${PANEL_VERSION}.apk
          apk add --allow-untrusted ./dae.apk ./luci-app-dae.apk
          \`\`\`

          守护进程按架构分发：x86_64、arm64（aarch64_generic）、riscv64（riscv64_generic），
          按设备选对应的一个；面板包与翻译包是 noarch。

          可选的 LuCI 中文翻译：

          \`\`\`sh
          cd /tmp
          wget -O luci-i18n-dae-zh-cn.apk \\
            https://github.com/szwjp/luci-app-dae/releases/download/v${TAG_VERSION}/luci-i18n-dae-zh-cn-${PANEL_VERSION}.apk
          apk add --allow-untrusted ./luci-i18n-dae-zh-cn.apk
          \`\`\`

          服务默认禁用；启用方式：
          \`uci set dae.main.enabled=1 && uci commit dae && /etc/init.d/dae start\`

          下载后可以先校验文件是否完整：

          \`\`\`sh
          sha256sum -c SHA256SUMS
          \`\`\`

          macOS 没有 sha256sum，用 \`shasum -a 256 -c SHA256SUMS\`。
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_VERSION: ${{ env.TAG_VERSION }}
        run: |
          set -euo pipefail
          TAG="v${{ env.TAG_VERSION }}"
          ls -la release/
          # A rerun replaces the assets of an existing release but keeps the
          # tag where it is. Deleting the tag would move a published release
          # to another commit, so the same URL would serve other bytes.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "dae + doona panel $TAG" --notes-file notes.md
          else
            # --target is a safety net. The check above already guarantees the
            # tag exists at the built commit, but if it ever did not, the new
            # tag must point at the commit that was built, not at the default
            # branch tip. The SHA is resolved locally, where the checkout
            # already names the tag's commit.
            gh release create "$TAG" release/* --title "dae + doona panel $TAG" --notes-file notes.md --target "$(git rev-parse HEAD)"
          fi
